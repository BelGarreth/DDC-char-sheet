<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crawler Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f14; --panel:#151922; --panel2:#1c2130; --line:#2a3245; --text:#e6e9f0; --muted:#8a93a8;
  --accent:#ffb627; --accent2:#3ddc97; --bad:#ff5d5d; --chip:#232a3b; --input:#0f131b;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f1ea; --panel:#ffffff; --panel2:#f6f4ee; --line:#d9d4c7; --text:#1d1f24; --muted:#6b6f7a;
    --accent:#b86e00; --accent2:#0f8a5f; --bad:#c62828; --chip:#efebe1; --input:#fbfaf6;
  }
}
:root[data-theme="light"]{
  --bg:#f3f1ea; --panel:#ffffff; --panel2:#f6f4ee; --line:#d9d4c7; --text:#1d1f24; --muted:#6b6f7a;
  --accent:#b86e00; --accent2:#0f8a5f; --bad:#c62828; --chip:#efebe1; --input:#fbfaf6;
}
:root[data-theme="dark"]{
  --bg:#0d0f14; --panel:#151922; --panel2:#1c2130; --line:#2a3245; --text:#e6e9f0; --muted:#8a93a8;
  --accent:#ffb627; --accent2:#3ddc97; --bad:#ff5d5d; --chip:#232a3b; --input:#0f131b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:"Chakra Petch",system-ui,sans-serif;letter-spacing:.02em;margin:0}
h1{font-size:20px;color:var(--accent)}
h2{font-size:15px;text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:flex;gap:8px;align-items:baseline}
h2 small{font-family:Inter,sans-serif;text-transform:none;color:var(--muted);font-weight:400;font-size:12px}
h3{font-size:13px;margin-bottom:6px}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header .sp{flex:1}
main{max-width:1200px;margin:0 auto;padding:16px;display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;grid-column:span 12;min-width:0}
.s6{grid-column:span 6}.s4{grid-column:span 4}.s8{grid-column:span 8}
@media (max-width:900px){.s6,.s4,.s8{grid-column:span 12}}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
input,select,textarea{font:inherit;color:var(--text);background:var(--input);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--accent)}
input[type=number]{width:70px}
button{font:inherit;font-size:13px;cursor:pointer;color:var(--text);background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:6px 10px;white-space:nowrap}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);color:#111;border-color:var(--accent);font-weight:600}
button.mini{padding:2px 7px;font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>div{flex:1;min-width:140px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.card .top{display:flex;gap:6px;margin-bottom:8px}
.pick{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--text);margin:3px 0;cursor:pointer}
.pick.dis{opacity:.45}
.tag{display:inline-block;font-size:11px;background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);margin-left:4px}
.warn{color:var(--bad);font-size:13px;margin-top:8px}
.ok{color:var(--accent2)}
.muted{color:var(--muted)}
.radios{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.radios label{display:flex;gap:6px;align-items:center;color:var(--text);font-size:13px;margin:0;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;border-bottom:1px solid var(--line);padding:6px 6px}
td{border-bottom:1px solid var(--line);padding:6px;vertical-align:top}
td input[type=text]{padding:3px 6px}
td input[type=number]{width:56px;padding:3px 6px}
.tw{overflow-x:auto}
.big{font-family:"Chakra Petch",sans-serif;font-size:22px;font-weight:700;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
.stat .nm{font-family:"Chakra Petch";font-weight:700;letter-spacing:.06em}
.stat .md{font-family:"Chakra Petch";font-size:26px;color:var(--accent);font-weight:700}
.stat select,.stat input{text-align:center;width:100%;margin-top:4px}
.stat .sub{font-size:11px;color:var(--muted);margin-top:6px}
.derived{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.dv{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.dv .k{font-size:11px;color:var(--muted);text-transform:uppercase}
.hb{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px}
.hb div{border:1px solid var(--accent2);color:var(--accent2);border-radius:4px;text-align:center;padding:6px 0;font-weight:700;cursor:pointer;user-select:none}
.hb div.lost{border-color:var(--line);color:var(--muted);text-decoration:line-through;background:var(--input)}
.note{font-size:12px;color:var(--muted)}
.r5{font-size:12px;color:var(--muted)}
.r5.on{color:var(--accent2)}
.hot{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px}
.hot div{display:flex;gap:6px;align-items:center}
.hot b{color:var(--muted);width:18px;text-align:right;font-size:12px}
.hot .auto{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;flex:1;font-size:13px}
footer{max-width:1200px;margin:0 auto;padding:0 16px 30px;font-size:12px;color:var(--muted)}
@media print{
  header,button,.noprint{display:none!important}
  body{background:#fff;color:#000}
  section{break-inside:avoid;border-color:#999}
  :root{--bg:#fff;--panel:#fff;--panel2:#fff;--line:#bbb;--text:#000;--muted:#444;--accent:#000;--accent2:#000;--input:#fff;--chip:#fff}
}
</style>
</head>
<body>
<header>
  <h1>CRAWLER SHEET</h1>
  <span class="muted">Dungeon Crawler Carl RPG</span>
  <span class="sp"></span>
  <button class="pri" data-act="randomize">Roll a random crawler</button>
  <button data-act="share">Copy share link</button>
  <button data-act="export">Export</button>
  <button data-act="import">Import</button>
  <button data-act="print">Print</button>
  <button data-act="theme" title="Toggle theme">◐</button>
  <button data-act="reset">Reset</button>
  <input type="file" id="importFile" accept="application/json" hidden>
</header>
<main id="app"></main>

function load(){
  const h=location.hash.match(/^#c=(.+)$/);
  if(h){try{const s=JSON.parse(decodeURIComponent(escape(atob(h[1]))));history.replaceState(null,'',location.pathname);return Object.assign(defaults(),s)}catch(e){}}
  try{const raw=localStorage.getItem(KEY);if(raw)return Object.assign(defaults(),JSON.parse(raw))}catch(e){}
  return defaults();
}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sgn=n=>(n>=0?'+':'')+n;
function statMod(v){v=Number(v)||0;if(v<=2)return 1;if(v<=5)return 2;if(v<=9)return 3;if(v<=19)return 4;if(v<=49)return 5;if(v<=99)return 6;if(v<=149)return 7;if(v<=199)return 8;if(v<=299)return 9;return 10}
function rankDie(r){if(r<=0)return'—';if(r===1)return'+1';if(r<=3)return'1d2';if(r<=5)return'1d4';if(r<=7)return'1d6';if(r<=9)return'1d8';return'1d10'}
const enh=k=>(Number(S.stats[k])||0)+(Number(S.enh[k])||0);
const M=k=>statMod(enh(k));
function diceStr(parts){
  const by={};parts.forEach(([n,s])=>by[s]=(by[s]||0)+n);
  return Object.keys(by).sort((a,b)=>b-a).map(s=>by[s]+'d'+s).join(' + ');
}
function cats(){return BG[S.kind]}

function info(name){
  if(W[name])return{kind:'weapon',s:W[name].s,t:'Evade'};
  if(SP[name])return SP[name].atk?{kind:'spell',s:'int',t:'Evade'}:{kind:'spell',s:null,t:'Passive'};
  if(DE[name])return{kind:'effect',s:null,t:'Passive',d:DE[name].d,r5:DE[name].r5};
  if(SK[name])return{kind:'skill',...SK[name]};
  return{kind:'custom',s:null,t:''};
}

function computeSkills(){
  const src=[];
  cats().forEach((c,i)=>{
    const b=S.bg[i],o=c.opts.find(o=>o[0]===b.opt);if(!o)return;
    b.picks.filter(p=>o[1].includes(p)).slice(0,2).forEach(p=>src.push({name:p,rank:c.rank,from:c.label}));
  });
  src.push({name:S.kind==='human'?'Unarmed Combat':'Slice Attack',rank:3,from:'Combat'});
  const c=S.combat;
  if(c.mode==='weapon')src.push({name:c.weapon,rank:3,from:'Weapon'});
  if(c.mode==='spell')src.push({name:c.spell,rank:3,from:'Attack spell'});
  if(c.mode==='h2h'){src.push({name:c.h2h,rank:3,from:'Hand-to-hand'});src.push({name:H2H[c.h2h],rank:1,from:'Damage Effect',fixed:false})}
  src.push({name:'Heal',rank:1,from:'Starting spell'});
  const map=new Map(),dups=[];
  for(const s of src){
    if(map.has(s.name)){const m=map.get(s.name);m.from.push(s.from);m.base=Math.max(m.base,s.rank);dups.push(s.name)}
    else map.set(s.name,{name:s.name,base:s.rank,from:[s.from]});
  }
  S.extra.forEach((e,i)=>{if(!map.has(e.name))map.set(e.name,{name:e.name,base:0,from:['Added'],extraIdx:i})});
  const list=[...map.values()].map(s=>{
    const max=SP[s.name]&&SP[s.name].max||15;
    s.rank=Math.max(0,Math.min(max,s.base+(Number(S.rankAdj[s.name])||0)));
    return s;
  });
  return{list,dups:[...new Set(dups)]};
}

function attackRow(sk){
  const r=sk.rank,w=W[sk.name],sp=SP[sk.name];
  const o=w||sp,hitStat=w?w.s:'int',dmgStat=w?w.ds:'int';
  const parts=[o.dmg];if(r>=5&&o.r5)parts.push(o.r5);
  let dmg=diceStr(parts)+(dmgStat?` + ${M(dmgStat)} <span class="muted">(${AB[dmgStat]})</span>`:'');
  const fx=[o.ty];
  if(sp)fx.push(`${sp.mp} MP`);
  fx.push(o.rg||'Melee');
  if(o.lim)fx.push(o.lim);
  if(o.ai)fx.push(`AI Favor ${o.ai}`);
  if(w&&w.fx)fx.push('Effects: '+w.fx.join(' / '));
  if(r>=5&&o.r5n)fx.push('R5: '+o.r5n);
  let label=sk.name;
  if(S.combat.mode==='weapon'&&S.combat.weapon===sk.name&&S.combat.custom.trim())label=`${esc(S.combat.custom.trim())} <span class="muted">(${esc(sk.name)})</span>`;
  else label=esc(label);
  return `<tr><td><b>${label}</b></td><td>${r}</td><td><b>${sgn(r+M(hitStat))}</b> <span class="muted">${r} + ${AB[hitStat]} ${M(hitStat)}</span></td><td>${dmg}</td><td>${rankDie(r)}</td><td class="note">${fx.join(' · ')}</td></tr>`;
}

      ${S.statMethod==='array'?sel('st-'+k,'stats.'+k,[2,3,4,5,6],S.stats[k],'data-num'):`<input type="number" id="st-${k}" data-p="stats.${k}" data-num min="1" value="${S.stats[k]}">`}
      <div class="sub">Unenhanced</div>
      <input type="number" id="en-${k}" data-p="enh.${k}" data-num value="${S.enh[k]}" title="Bonus from gear, buffs, etc.">
      <div class="sub">Bonus → <b>${enh(k)}</b> enhanced</div></div>`).join('')}
    </div>
    <p class="note">Mod comes from the Enhanced value (Table 9). Bonus stays 0 at creation.</p>
  </section>

  <section>
    <h2>Steps 4–8 · Derived</h2>
    <div class="derived">
      <div class="dv"><div class="k">Evade</div><div class="big">d20 ${sgn(M('dex')+dodge)}</div><div class="note">Dex ${M('dex')}${dodge?` + Dodge ${dodge}`:''}</div></div>
      <div class="dv"><div class="k">Health</div><div class="big">${hp}</div><div class="note">Con ${enh('con')} × 10</div></div>
      <div class="dv"><div class="k">Mana</div><div style="display:flex;gap:6px;align-items:center"><input type="number" id="d-mana" data-p="manaCur" data-num value="${mana}" style="width:64px"><span class="big">/ ${maxMana}</span></div><div class="note">Max = Enhanced Int</div></div>
      <div class="dv"><div class="k">Move / Step</div><div class="big">${move} / 10</div><div class="note">feet${move>20?' (Running R5)':''}</div></div>
      <div class="dv"><div class="k">AI Favor</div><div style="display:flex;gap:6px;align-items:center"><span class="big">${ai}</span><button class="mini" data-act="ai" data-v="-1">−</button><button class="mini" data-act="ai" data-v="1">+</button></div><div class="note">${human?'Humans start with 1':'Animals start with 0'}</div></div>
      <div class="dv"><div class="k">Size</div><div class="big">${human?4:S.size}</div><div class="note">${SIZES.find(z=>z[0]===(human?4:Number(S.size)))?.[1]||''}</div></div>
    </div>
    <h3 style="margin-top:14px">Health Bar <span class="muted" style="font-weight:400">each slot = 10% of Health, absorbs damage up to your Con Mod (${slot}). Click to mark lost.</span></h3>
    <div class="hb">${Array.from({length:10},(_,i)=>`<div data-act="hb" data-i="${i}" class="${i>=10-S.hbLost?'lost':''}">${slot}</div>`).join('')}</div>
  </section>

  <section>
    <h2>Attacks</h2>
    <div class="tw"><table><thead><tr><th>Attack</th><th>Rank</th><th>To hit</th><th>Damage</th><th>Rank die</th><th>Effects</th></tr></thead><tbody>${atkRows}</tbody></table></div>
    <p class="note">Attacks roll d20 + to hit vs. the target's Evade (10 + Dex + Floor). Rank-5 upgrades are applied automatically. The Rank die only adds when an effect says so. Attack spells use Int to hit (the book doesn't say otherwise).</p>
  </section>

  <section>
    <h2>Skills <small>d20 + Rank + Stat Mod. Edit Rank as you advance (max 15).</small></h2>
    <div class="tw"><table><thead><tr><th>Skill</th><th>Rank</th><th>Stat &amp; Mod</th><th>Roll</th><th>Check</th><th>What it does / Rank 5 upgrade</th><th>Your notes</th><th title="Marked for Skill Advancement">✓</th></tr></thead><tbody>
    ${list.map(s=>{const i=info(s.name),o=W[s.name]||SP[s.name];const st=i.s;
      const desc=i.d||(SP[s.name]&&SP[s.name].d)||(o?'Attack skill, see Attacks.':'');
      const r5=i.r5||(SP[s.name]&&SP[s.name].r5)||'';
      const max=SP[s.name]&&SP[s.name].max||15;
      return `<tr><td><b>${esc(s.name)}</b>${s.from.map(f=>`<span class="tag">${esc(f)}</span>`).join('')}${s.extraIdx!=null?` <button class="mini noprint" data-act="rmskill" data-i="${s.extraIdx}">✕</button>`:''}</td>
      <td><input type="number" id="rk-${esc(s.name)}" data-rank="${esc(s.name)}" data-base="${s.base}" min="0" max="${max}" value="${s.rank}"></td>
      <td>${st?`${AB[st]} ${sgn(M(st))}`:'None'}</td>
      <td><b>${st?sgn(s.rank+M(st)):'—'}</b></td>
      <td class="note">${esc(i.t)}</td>
      <td class="note">${esc(desc)}${r5?`<div class="r5 ${s.rank>=5?'on':''}">R5: ${esc(r5)}</div>`:''}</td>
      <td><input type="text" id="sn-${esc(s.name)}" data-p="skillNotes.${esc(s.name)}" value="${esc(S.skillNotes[s.name]||'')}"></td>
      <td><input type="checkbox" id="mk-${esc(s.name)}" data-p="marks.${esc(s.name)}" ${S.marks[s.name]?'checked':''}></td></tr>`}).join('')}
    </tbody></table></div>
    <div class="row noprint" style="margin-top:10px">
      <div><label>Add a skill (learned in play)</label><select id="add-sk"><option value="">— choose —</option>${allNames.map(n=>`<option>${esc(n)}</option>`).join('')}</select></div>
      <div style="flex:0 0 auto;min-width:0"><button data-act="addskill">Add at Rank 1</button></div>
      <div style="flex:0 0 auto;min-width:0"><button data-act="clearmarks">Clear advancement marks</button></div>
    </div>
    <p class="note">Advancement: roll d20 ≥ current Rank to gain a Rank. Rank 4 or lower: every 2 hours of play. Rank 5+: end of each floor.</p>
  </section>

  <section class="s6">
    <h2>Hotlist <small>10 slots, up to 999 of one item per slot</small></h2>
    <div class="hot">
      ${auto.map((a,i)=>`<div><b>${i+1}</b><span class="auto"><b style="width:auto;color:var(--text);text-align:left">${esc(a.t)}</b> <span class="muted">${esc(a.n)}</span></span></div>`).join('')}
      ${Array.from({length:userSlots},(_,i)=>`<div><b>${auto.length+i+1}</b>${txt('hl'+i,'hotlist.'+i,S.hotlist[i])}</div>`).join('')}
    </div>
  </section>

  <section class="s6">
    <h2>Step 10 · Starting stuff</h2>
    <div class="row" style="margin-bottom:8px">${Object.keys(KITS).map(k=>`<div style="flex:0 0 auto;min-width:0"><button class="mini" data-act="kit" data-k="${k}">${k}</button></div>`).join('')}</div>
    <div class="row"><div><label>Clothing</label>${txt('g-c','gear.clothes',S.gear.clothes)}</div><div><label>Weapon (in hand)</label>${txt('g-w','gear.weapon',S.gear.weapon,S.combat.mode==='weapon'?(S.combat.custom||S.combat.weapon):S.combat.mode==='spell'?'none (spellcaster)':'none (fists of fury)')}</div></div>
    <div class="row" style="margin-top:8px"><div><label>Interesting / useful item</label>${txt('g-i','gear.item',S.gear.item)}</div><div><label>Weird stuff</label>${txt('g-x','gear.weird',S.gear.weird)}</div></div>
    <label style="margin-top:8px">Inventory</label><textarea id="g-inv" data-p="inventory">${esc(S.inventory)}</textarea>
  </section>

  <section>
    <h2>Step 9 · Past Trauma, Loose End, Regret <small>Share these with your GM</small></h2>
    <div class="grid4">
      <div><h3>Past Trauma</h3>${tableSel('t-tr','trauma',TRAUMA,S.trauma)}</div>
      <div><h3>Loose End</h3>${tableSel('t-le','loose',LOOSE,S.loose)}</div>
      <div><h3>Regret</h3>${tableSel('t-rg','regret',REGRET,S.regret)}</div>
    </div>
  </section>

  <section>
    <h2>Notes</h2>
    <textarea id="n-notes" data-p="notes" style="min-height:110px">${esc(S.notes)}</textarea>
  </section>`;
}

function setPath(p,v){const ks=p.split('.');let o=S;for(let i=0;i<ks.length-1;i++){o[ks[i]]=o[ks[i]]??{};o=o[ks[i]]}o[ks[ks.length-1]]=v}
let pending=null;
function rerender(){
  clearTimeout(pending);
  pending=setTimeout(()=>{const id=document.activeElement&&document.activeElement.id;const y=scrollY;render();save();if(id){const el=document.getElementById(id);if(el)el.focus({preventScroll:true})}scrollTo(0,y)},0);
}

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.p&&(t.type==='text'||t.tagName==='TEXTAREA')){
    setPath(t.dataset.p,t.value);save();
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.pick!=null){
    const b=S.bg[+t.dataset.pick];
    if(t.checked){if(b.picks.length<2)b.picks.push(t.value)}else b.picks=b.picks.filter(x=>x!==t.value);
    return rerender();
  }
  if(t.dataset.rank!=null){
    const v=Math.max(0,Math.min(15,parseInt(t.value)||0));
    S.rankAdj[t.dataset.rank]=v-Number(t.dataset.base);
    return rerender();
  }
  if(!t.dataset.p)return;
  let v=t.type==='checkbox'?t.checked:t.value;
  if(t.dataset.num!==undefined)v=t.value===''?null:Number(t.value);
  if(t.type==='text'||t.tagName==='TEXTAREA'){
    if(t.dataset.p==='combat.custom')rerender();
    return;
  }
  setPath(t.dataset.p,v);
  if(t.dataset.p==='kind'){S.bg=[0,1,2,3].map(()=>({opt:'',picks:[]}));if(S.combat.weapon==='Slice Attack'||(v==='human'&&W[S.combat.weapon]?.animal))S.combat.weapon='Club'}
  if(/^bg\.\d\.opt$/.test(t.dataset.p))S.bg[+t.dataset.p.split('.')[1]].picks=[];
  if(t.dataset.p==='statMethod'&&v==='array')S.stats={str:2,int:3,con:4,dex:5,cha:6};
  if(t.dataset.p.startsWith('stats.int')||t.dataset.p.startsWith('enh.int'))S.manaCur=null;
  rerender();
});

function rollStats(){STATS.forEach(([k])=>S.stats[k]=1+d(5))}
function rollBg(i){const c=cats()[i];S.bg[i]={opt:c.opts[d(c.opts.length)-1][0],picks:[]}}
function randomize(){
  const kind=S.kind;S=defaults();S.kind=kind;
  S.crawlerNo=(500000+Math.floor(Math.random()*12400001)).toLocaleString();
  const taken=new Set();
  cats().forEach((c,i)=>{rollBg(i);const o=c.opts.find(o=>o[0]===S.bg[i].opt);const pool=o[1].filter(s=>!taken.has(s));
    const sh=[...pool].sort(()=>Math.random()-.5).slice(0,2);sh.forEach(s=>taken.add(s));S.bg[i].picks=sh});
  S.statMethod='roll';rollStats();
  const r=Math.random();
  if(r<.15&&enh('int')>=4){S.combat.mode='spell';S.combat.spell=pick(Object.keys(SP).filter(n=>SP[n].start))}
  else if(r<.25){S.combat.mode='h2h';S.combat.h2h=pick(Object.keys(H2H))}
  else{S.combat.mode='weapon';S.combat.weapon=pick(Object.keys(W).filter(n=>W[n].g!=='Hand-to-Hand'&&!W[n].animal&&!taken.has(n)))}
  if(kind==='animal')S.size=pick([2,3,4]);
  S.trauma=pick(TRAUMA);S.loose=pick(LOOSE);S.regret=pick(REGRET);
  Object.assign(S.gear,KITS[pick(Object.keys(KITS))]);
  S.gear.weapon='';
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;
  if(a==='rollbg'){rollBg(+t.dataset.i);return rerender()}
  if(a==='rollstats'){rollStats();S.manaCur=null;return rerender()}
  if(a==='crawlerNo'){S.crawlerNo=(500000+Math.floor(Math.random()*12400001)).toLocaleString();return rerender()}
  if(a==='roll-trauma'){S.trauma=pick(TRAUMA);return rerender()}
  if(a==='roll-loose'){S.loose=pick(LOOSE);return rerender()}
  if(a==='roll-regret'){S.regret=pick(REGRET);return rerender()}
  if(a==='ai'){S.aiAdj=(Number(S.aiAdj)||0)+Number(t.dataset.v);if((S.kind==='human'?1:0)+S.aiAdj<0)S.aiAdj++;return rerender()}
  if(a==='hb'){const i=+t.dataset.i,lost=10-i;S.hbLost=S.hbLost===lost?lost-1:lost;return rerender()}
  if(a==='kit'){Object.assign(S.gear,KITS[t.dataset.k]);return rerender()}
  if(a==='addskill'){const n=document.getElementById('add-sk').value;if(!n)return;S.extra.push({name:n});S.rankAdj[n]=1;return rerender()}
  if(a==='rmskill'){const ex=S.extra.splice(+t.dataset.i,1)[0];if(ex)delete S.rankAdj[ex.name];return rerender()}
  if(a==='clearmarks'){S.marks={};return rerender()}
  if(a==='randomize'){if(!confirm('Replace this crawler with a random one?'))return;randomize();return rerender()}
  if(a==='reset'){if(!confirm('Wipe this crawler and start over?'))return;S=defaults();return rerender()}
  if(a==='print')return print();
  if(a==='theme'){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem(KEY+'-theme',r.dataset.theme)}catch(e){}return}
  if(a==='export'){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download=(S.name||'crawler').replace(/[^\w-]+/g,'_')+'.json';l.click();URL.revokeObjectURL(u);return}
  if(a==='import')return document.getElementById('importFile').click();
  if(a==='share'){const url=location.origin+location.pathname+'#c='+btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>{t.textContent='Link copied';setTimeout(()=>t.textContent='Copy share link',1500)}).catch(()=>prompt('Copy this link:',url));return}
});
document.getElementById('importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  f.text().then(txt=>{S=Object.assign(defaults(),JSON.parse(txt));rerender()}).catch(()=>alert('That file is not a crawler export.'));
  e.target.value='';
});
try{const th=localStorage.getItem(KEY+'-theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
render();save();
</script>
</body>
</html>
